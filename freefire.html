<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Battle Zone</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101820;
    font-family:Arial,sans-serif;
}


/* =========================
   GAME AREA
========================= */

#game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #172b45 0%,
        #234d38 55%,
        #142719 100%
    );
}


/* =========================
   HUD
========================= */

#hud{

    position:absolute;

    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;

    color:white;

    font-size:18px;
    font-weight:bold;

    z-index:100;
}


/* =========================
   HEALTH BAR
========================= */

#healthBox{

    position:absolute;

    top:42px;
    left:10px;

    width:160px;
    height:16px;

    background:#555;

    border-radius:10px;

    overflow:hidden;

    z-index:100;
}


#health{

    width:100%;
    height:100%;

    background:#00e676;

    transition:
    width .2s;
}


/* =========================
   PLAYER / SHOOTER
========================= */

#player{

    position:absolute;

    width:50px;
    height:50px;

    left:50%;

    bottom:85px;

    transform:translateX(-50%);

    background:#2196f3;

    border:3px solid white;

    border-radius:50%;

    z-index:50;
}


/* Gun pointing upward */

#player::after{

    content:"";

    position:absolute;

    width:9px;
    height:35px;

    background:#222;

    left:17px;
    top:-32px;

    border-radius:6px;
}


/* =========================
   ENEMY
========================= */

.enemy{

    position:absolute;

    width:40px;
    height:40px;

    background:#e53935;

    border:3px solid white;

    border-radius:50%;

    z-index:40;
}


/* Enemy eye */

.enemy::after{

    content:"";

    position:absolute;

    width:8px;
    height:8px;

    background:white;

    border-radius:50%;

    left:12px;
    top:10px;
}


/* =========================
   BULLET
========================= */

.bullet{

    position:absolute;

    width:8px;
    height:18px;

    background:#ffd600;

    border-radius:5px;

    z-index:60;

    box-shadow:
    0 0 8px #ffd600;
}


/* =========================
   CONTROLS
========================= */

#controls{

    position:absolute;

    left:15px;
    bottom:15px;

    display:flex;

    gap:10px;

    z-index:100;
}


.control{

    width:70px;
    height:60px;

    border:2px solid white;

    border-radius:12px;

    background:
    rgba(255,255,255,.20);

    color:white;

    font-size:28px;
    font-weight:bold;
}


/* =========================
   FIRE BUTTON
========================= */

#fire{

    position:absolute;

    right:20px;
    bottom:15px;

    width:95px;
    height:65px;

    border-radius:15px;

    background:#f44336;

    border:3px solid white;

    color:white;

    font-size:18px;
    font-weight:bold;

    z-index:100;
}


/* =========================
   GAME OVER
========================= */

#message{

    display:none;

    position:absolute;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    width:280px;

    padding:30px;

    background:
    rgba(0,0,0,.92);

    color:white;

    text-align:center;

    border-radius:15px;

    z-index:200;
}


#restart{

    margin-top:15px;

    padding:12px 25px;

    border:0;

    border-radius:8px;

    background:#2196f3;

    color:white;

    font-size:17px;
}


/* =========================
   HIT FLASH
========================= */

.hit{

    animation:
    hitFlash .15s;
}


@keyframes hitFlash{

    0%{
        transform:
        translateX(-50%) scale(1);
    }

    50%{
        transform:
        translateX(-50%) scale(1.2);
    }

    100%{
        transform:
        translateX(-50%) scale(1);
    }
}

</style>

</head>


<body>


<div id="game">


    <!-- =====================
         HUD
    ====================== -->

    <div id="hud">

        <div>
            🎮 BATTLE ZONE
        </div>

        <div>
            SCORE:
            <span id="score">0</span>
        </div>

    </div>


    <!-- =====================
         HEALTH
    ====================== -->

    <div id="healthBox">

        <div id="health"></div>

    </div>


    <!-- =====================
         PLAYER
    ====================== -->

    <div id="player"></div>


    <!-- =====================
         LEFT / RIGHT
    ====================== -->

    <div id="controls">

        <button
            class="control"
            id="left">

            ◀

        </button>


        <button
            class="control"
            id="right">

            ▶

        </button>

    </div>


    <!-- =====================
         FIRE
    ====================== -->

    <button id="fire">

        🔥 FIRE

    </button>


    <!-- =====================
         GAME OVER
    ====================== -->

    <div id="message">

        <h2>
            GAME OVER
        </h2>

        <p>

            Your Score:

            <span id="finalScore">
                0
            </span>

        </p>


        <button id="restart">

            PLAY AGAIN

        </button>

    </div>


</div>


<script>


/* =========================
   VARIABLES
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const leftButton =
    document.getElementById("left");

const rightButton =
    document.getElementById("right");

const fireButton =
    document.getElementById("fire");


let playerX =
    window.innerWidth / 2;


let health = 100;

let score = 0;

let gameOver = false;

let movingLeft = false;

let movingRight = false;


/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer(){

    if(gameOver){

        return;

    }


    const speed = 6;


    if(movingLeft){

        playerX -= speed;

    }


    if(movingRight){

        playerX += speed;

    }


    const halfPlayer = 25;


    const minX =
        halfPlayer;


    const maxX =
        window.innerWidth -
        halfPlayer;


    if(playerX < minX){

        playerX = minX;

    }


    if(playerX > maxX){

        playerX = maxX;

    }


    player.style.left =
        playerX + "px";


    requestAnimationFrame(
        updatePlayer
    );
}


updatePlayer();


/* =========================
   BUTTON HELPER
========================= */

function setupMoveButton(
    button,
    direction
){

    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            if(direction === "left"){

                movingLeft = true;

            }

            if(direction === "right"){

                movingRight = true;

            }

        }
    );


    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            if(direction === "left"){

                movingLeft = false;

            }

            if(direction === "right"){

                movingRight = false;

            }

        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            movingLeft = false;

            movingRight = false;

        }
    );


    button.addEventListener(
        "pointerleave",
        function(){

            movingLeft = false;

            movingRight = false;

        }
    );
}


setupMoveButton(
    leftButton,
    "left"
);


setupMoveButton(
    rightButton,
    "right"
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){

            movingLeft = true;

        }


        if(e.key === "ArrowRight"){

            movingRight = true;

        }


        if(e.code === "Space"){

            shoot();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.key === "ArrowLeft"){

            movingLeft = false;

        }


        if(e.key === "ArrowRight"){

            movingRight = false;

        }

    }
);


/* =========================
   SHOOT
========================= */

function shoot(){

    if(gameOver){

        return;

    }


    const bullet =
        document.createElement("div");


    bullet.className =
        "bullet";


    let bulletX =
        playerX;


    let bulletY =
        window.innerHeight - 120;


    bullet.style.left =
        (bulletX - 4) + "px";


    bullet.style.top =
        bulletY + "px";


    game.appendChild(
        bullet
    );


    const bulletTimer =
        setInterval(
            function(){

                if(gameOver){

                    bullet.remove();

                    clearInterval(
                        bulletTimer
                    );

                    return;

                }


                /*
                   BULLET MOVES
                   BOTTOM → TOP
                */

                bulletY -= 10;


                bullet.style.top =
                    bulletY + "px";


                const enemies =
                    document.querySelectorAll(
                        ".enemy"
                    );


                enemies.forEach(
                    function(enemy){

                        const enemyX =
                            parseFloat(
                                enemy.style.left
                            );


                        const enemyY =
                            parseFloat(
                                enemy.style.top
                            );


                        const distance =
                            Math.sqrt(

                                Math.pow(
                                    bulletX -
                                    enemyX,
                                    2
                                )

                                +

                                Math.pow(
                                    bulletY -
                                    enemyY,
                                    2
                                )

                            );


                        if(distance < 35){

                            enemy.remove();

                            bullet.remove();

                            clearInterval(
                                bulletTimer
                            );


                            score += 10;


                            document
                            .getElementById(
                                "score"
                            )
                            .textContent =
                                score;

                        }

                    }
                );


                if(bulletY < -30){

                    bullet.remove();

                    clearInterval(
                        bulletTimer
                    );

                }

            },
            20
        );
}


/* =========================
   FIRE BUTTON
========================= */

fireButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        shoot();

    }
);


/* =========================
   CREATE ENEMY
========================= */

function createEnemy(){

    if(gameOver){

        return;

    }


    const enemy =
        document.createElement("div");


    enemy.className =
        "enemy";


    /*
       RANDOM X

       ALWAYS TOP
    */

    const enemyX =
        25 +
        Math.random() *
        (
            window.innerWidth - 50
        );


    let enemyY = -50;


    enemy.style.left =
        enemyX + "px";


    enemy.style.top =
        enemyY + "px";


    game.appendChild(
        enemy
    );


    moveEnemy(enemy);
}


/* =========================
   ENEMY MOVEMENT
========================= */

function moveEnemy(enemy){

    const speed =
        2 +
        Math.random() * 1.5;


    const timer =
        setInterval(
            function(){

                if(gameOver){

                    clearInterval(
                        timer
                    );

                    return;

                }


                let enemyY =
                    parseFloat(
                        enemy.style.top
                    );


                /*
                   TOP → BOTTOM
                */

                enemyY += speed;


                enemy.style.top =
                    enemyY + "px";


                const enemyX =
                    parseFloat(
                        enemy.style.left
                    );


                /*
                   SHOOTER Y
                */

                const playerY =
                    window.innerHeight -
                    85;


                /*
                   CHECK COLLISION
                */

                const distance =
                    Math.sqrt(

                        Math.pow(
                            enemyX -
                            playerX,
                            2
                        )

                        +

                        Math.pow(
                            enemyY -
                            playerY,
                            2
                        )

                    );


                if(distance < 45){

                    enemy.remove();

                    clearInterval(
                        timer
                    );

                    damagePlayer();

                    return;

                }


                /*
                   ENEMY PASSED
                   THE SHOOTER
                */

                if(
                    enemyY >
                    window.innerHeight + 50
                ){

                    enemy.remove();

                    clearInterval(
                        timer
                    );

                    damagePlayer();

                }

            },
            30
        );
}


/* =========================
   DAMAGE
========================= */

function damagePlayer(){

    if(gameOver){

        return;

    }


    health -= 20;


    if(health < 0){

        health = 0;

    }


    document.getElementById(
        "health"
    ).style.width =
        health + "%";


    /*
       PLAYER FLASH
    */

    player.classList.add(
        "hit"
    );


    setTimeout(
        function(){

            player.classList.remove(
                "hit"
            );

        },
        150
    );


    if(health <= 0){

        endGame();

    }

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    gameOver = true;


    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    document.getElementById(
        "message"
    ).style.display =
        "block";

}


/* =========================
   RESTART
========================= */

document.getElementById(
    "restart"
).addEventListener(
    "click",
    function(){

        location.reload();

    }
);


/* =========================
   ENEMY SPAWN
========================= */

setInterval(
    function(){

        if(!gameOver){

            createEnemy();

        }

    },
    1200
);


/* =========================
   EXTRA ENEMIES
========================= */

setTimeout(
    function(){

        if(!gameOver){

            createEnemy();

        }

    },
    500
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function(){

        const maxX =
            window.innerWidth - 25;


        if(playerX > maxX){

            playerX = maxX;

        }

    }
);

</script>

</body>
</html>
