<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Forest Battle</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    background:#101820;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h2{
    margin:12px 0;
}

#game{
    position:relative;
    width:100%;
    max-width:700px;
    height:430px;
    margin:auto;
    overflow:hidden;
    background:
      linear-gradient(#8fd3ff 0 45%,#5c9e38 45% 100%);
    border:3px solid #222;
}

/* Ground */
.ground{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:45%;
    background:
      radial-gradient(circle at 20% 30%,#477d2e 0 4px,transparent 5px),
      radial-gradient(circle at 70% 50%,#477d2e 0 4px,transparent 5px),
      #39752d;
}

/* Trees */
.tree{
    position:absolute;
    bottom:105px;
    width:25px;
    height:180px;
    background:#684021;
    border-radius:8px;
}

.tree:before{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    left:-42px;
    top:-65px;
    background:#205c2b;
    border-radius:50%;
    box-shadow:
      55px -25px 0 #276b32,
      -35px 15px 0 #2b7336;
}

.t1{left:12%}
.t2{left:48%}
.t3{left:82%}

/* People */
.person{
    position:absolute;
    bottom:105px;
    width:65px;
    height:115px;
    transition:all .7s ease;
}

.head{
    position:absolute;
    top:0;
    left:20px;
    width:30px;
    height:30px;
    background:#e4a16b;
    border-radius:50%;
}

.body{
    position:absolute;
    top:30px;
    left:25px;
    width:20px;
    height:50px;
    background:#2874b8;
    border-radius:8px;
}

.arm{
    position:absolute;
    top:35px;
    width:38px;
    height:8px;
    background:#e4a16b;
    border-radius:5px;
}

.arm.left{
    left:-5px;
    transform:rotate(25deg);
}

.arm.right{
    left:32px;
    transform:rotate(-25deg);
}

.leg{
    position:absolute;
    top:76px;
    width:9px;
    height:42px;
    background:#252525;
    border-radius:5px;
}

.leg.left{left:23px;transform:rotate(10deg)}
.leg.right{left:38px;transform:rotate(-10deg)}

#p1{
    left:27%;
}

#p2{
    left:57%;
}

/* Archer */
#archer{
    position:absolute;
    left:78%;
    bottom:110px;
    width:65px;
    height:115px;
    opacity:0;
    transition:.5s;
}

#archer.show{
    opacity:1;
}

/* Arrow */
#arrow{
    position:absolute;
    width:100px;
    height:5px;
    background:#4b2d17;
    border-radius:4px;
    transform-origin:left center;
    opacity:0;
    z-index:10;
}

#arrow:after{
    content:"";
    position:absolute;
    right:-2px;
    top:-5px;
    border-left:15px solid #222;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
}

/* Fallen */
.dead{
    transform:rotate(90deg) translateY(25px);
    opacity:.75;
}

/* Handshake */
.handshake{
    transform:translateX(-15px);
}

#message{
    min-height:28px;
    margin:10px;
    font-size:18px;
    font-weight:bold;
}

button{
    min-width:150px;
    min-height:50px;
    border:0;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    background:#e67e22;
    color:white;
}

button:disabled{
    opacity:.45;
}

#restart{
    background:#555;
    margin-left:8px;
}
</style>
</head>

<body>

<h2>🌲 FOREST BATTLE</h2>

<div id="game">

    <div class="ground"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>

    <!-- Person 1 -->
    <div class="person" id="p1">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
    </div>

    <!-- Person 2 -->
    <div class="person" id="p2">
        <div class="head"></div>
        <div class="body" style="background:#b63b3b"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
    </div>

    <!-- Archer -->
    <div id="archer" class="person">
        <div class="head"></div>
        <div class="body" style="background:#6b3fa0"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
    </div>

    <div id="arrow"></div>

</div>

<div id="message">
    Click ARROW to attack
</div>

<button id="arrowBtn">🏹 ARROW</button>
<button id="restart">🔄 RESTART</button>

<script>

const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");
const archer = document.getElementById("archer");
const arrow = document.getElementById("arrow");
const arrowBtn = document.getElementById("arrowBtn");
const restartBtn = document.getElementById("restart");
const message = document.getElementById("message");

let finished = false;

/* Initial fight animation */
let fightTimer = setInterval(() => {

    if(finished) return;

    p1.style.transform =
        p1.style.transform === "translateX(10px)"
        ? "translateX(-10px)"
        : "translateX(10px)";

    p2.style.transform =
        p2.style.transform === "translateX(-10px)"
        ? "translateX(10px)"
        : "translateX(-10px)";

},400);


/* ARROW CLICK */
arrowBtn.addEventListener("click",()=>{

    if(finished) return;

    finished = true;
    clearInterval(fightTimer);

    arrowBtn.disabled = true;

    message.textContent = "🏹 Arrow released!";

    /* Archer appears from behind tree */
    archer.classList.add("show");

    /* Put arrow near archer */
    const gameRect =
        document.getElementById("game").getBoundingClientRect();

    const p1Rect = p1.getBoundingClientRect();

    const startX =
        archer.getBoundingClientRect().left -
        gameRect.left;

    const startY =
        archer.getBoundingClientRect().top -
        gameRect.top + 45;

    const targetX =
        p1Rect.left -
        gameRect.left + 20;

    const targetY =
        p1Rect.top -
        gameRect.top + 50;

    const dx = targetX - startX;
    const dy = targetY - startY;

    const distance = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy,dx) * 180 / Math.PI;

    arrow.style.left = startX + "px";
    arrow.style.top = startY + "px";
    arrow.style.width = distance + "px";
    arrow.style.transform =
        "rotate("+angle+"deg)";
    arrow.style.opacity = "1";

    /* Arrow flies only after button click */
    setTimeout(()=>{

        arrow.style.left = targetX + "px";
        arrow.style.top = targetY + "px";

    },50);


    /* Hit */
    setTimeout(()=>{

        arrow.style.opacity = "0";

        p1.classList.add("dead");

        message.textContent =
            "Person 1 is out. Person 2 and Archer meet.";

    },800);


    /* Handshake */
    setTimeout(()=>{

        p2.classList.add("handshake");

        archer.style.left = "68%";

        message.textContent =
            "🤝 Person 2 and Archer shake hands!";

    },1600);

});


/* Restart */
restartBtn.addEventListener("click",()=>{

    finished = false;

    clearInterval(fightTimer);

    p1.classList.remove("dead");
    p2.classList.remove("handshake");

    p1.style.transform = "";
    p2.style.transform = "";

    archer.classList.remove("show");
    archer.style.left = "78%";

    arrow.style.opacity = "0";

    arrowBtn.disabled = false;

    message.textContent =
        "Click ARROW to attack";

    fightTimer = setInterval(() => {

        if(finished) return;

        p1.style.transform =
            p1.style.transform === "translateX(10px)"
            ? "translateX(-10px)"
            : "translateX(10px)";

        p2.style.transform =
            p2.style.transform === "translateX(-10px)"
            ? "translateX(10px)"
            : "translateX(-10px)";

    },400);

});

</script>

</body>
</html>
