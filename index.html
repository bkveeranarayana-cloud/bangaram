<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME-GENERATOR</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #101522;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 520px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: #1b2333;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
}

input,
button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

input {
    background: white;
    color: black;
}

button {
    cursor: pointer;
    font-weight: bold;
}

.loginBtn {
    background: #22c55e;
    color: white;
}

.generateBtn {
    background: #2563eb;
    color: white;
}

.stopBtn {
    background: #dc2626;
    color: white;
}

.logoutBtn {
    background: #7f1d1d;
    color: white;
}

.status {
    margin-top: 15px;
    padding: 12px;
    background: #111827;
    border-radius: 8px;
    word-break: break-word;
}

.hidden {
    display: none;
}

.gameId {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 15px;
}

.cell {
    background: #334155;
    padding: 15px 5px;
    text-align: center;
    border-radius: 6px;
    font-size: 18px;
    font-weight: bold;
}

.total {
    margin-top: 12px;
    padding: 10px;
    background: #0f172a;
    border-radius: 6px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>GAME-GENERATOR</h1>

<!-- LOGIN -->
<div id="loginCard" class="card">

    <h2>ADMIN LOGIN</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button
        class="loginBtn"
        onclick="adminLogin()"
    >
        LOGIN
    </button>

    <div id="loginStatus" class="status"></div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

    <div class="card">

        <h2>GAME GENERATOR</h2>

        <p>
            Game IDs:
            <b>MKND840001</b>
            to
            <b>MKND842500</b>
        </p>

        <p>
            Numbers:
            <b>1 - 25</b>
        </p>

        <p>
            Grid:
            <b>4 × 4</b>
        </p>

        <p>
            Rule:
            <b>Rows + Columns only</b>
        </p>

        <button
            class="generateBtn"
            onclick="generateGames()"
        >
            GENERATE & SAVE 2500 GAMES
        </button>

        <button
            class="stopBtn"
            onclick="stopGeneration()"
        >
            STOP
        </button>

        <button
            class="logoutBtn"
            onclick="logout()"
        >
            LOGOUT
        </button>

        <div id="status" class="status">
            Ready.
        </div>

    </div>


    <!-- PREVIEW -->
    <div id="previewCard" class="card hidden">

        <div id="previewGameId" class="gameId"></div>

        <div id="grid" class="grid"></div>

        <div id="rowTotals" class="total"></div>

        <div id="columnTotals" class="total"></div>

        <div id="magicTotal" class="total"></div>

    </div>

</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    getDocs,
    collection,
    writeBatch,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyD2ZItFk5xcqFUCLMehkoWtK88hjujkMuc",
    authDomain: "bangaram-34c98.firebaseapp.com",
    projectId: "bangaram-34c98",
    storageBucket: "bangaram-34c98.firebasestorage.app",
    messagingSenderId: "382943394283",
    appId: "1:382943394283:web:bf11bb5597dfd2782881ae"
};


/* =========================
   FIREBASE INITIALIZE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
    "rlUDXoyMRNcYYad6liiF9tq3M2t2";


/* =========================
   VARIABLES
========================= */

let stopRequested = false;

let existingGames = new Set();


/* =========================
   LOGIN
========================= */

window.adminLogin = async function () {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");

    if (!email || !password) {

        status.innerText =
            "Please enter email and password.";

        return;
    }

    status.innerText = "Logging in...";

    try {

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        if (result.user.uid !== ADMIN_UID) {

            await signOut(auth);

            status.innerText =
                "Access denied. Admin only.";

            return;
        }

        status.innerText =
            "Admin login successful.";

    } catch (error) {

        console.error(error);

        status.innerText =
            "Login error: " + error.message;
    }
};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async (user) => {

    const loginCard =
        document.getElementById("loginCard");

    const adminPanel =
        document.getElementById("adminPanel");

    if (user && user.uid === ADMIN_UID) {

        loginCard.classList.add("hidden");

        adminPanel.classList.remove("hidden");

        document.getElementById("status").innerText =
            "Admin connected to Firebase.";

    } else {

        loginCard.classList.remove("hidden");

        adminPanel.classList.add("hidden");
    }

});


/* =========================
   LOGOUT
========================= */

window.logout = async function () {

    await signOut(auth);

};


/* =========================
   RANDOM SHUFFLE
========================= */

function shuffle(array) {

    const a = [...array];

    for (let i = a.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [a[i], a[j]] =
            [a[j], a[i]];
    }

    return a;
}


/* =========================
   CREATE VALID 4x4 GAME
   NUMBERS 1 - 25
   16 UNIQUE NUMBERS
   ROWS = COLUMNS
   NO DIAGONALS
========================= */

function createGame() {

    /*
       We create four rows.

       Every row has the same target.

       Example:

       8  7  9  10 = 34
       9  10 8  7  = 34
       ...

       Numbers are unique.
    */

    const allNumbers =
        Array.from(
            { length: 25 },
            (_, i) => i + 1
        );


    /*
       Try different random selections.
    */

    for (let attempt = 0; attempt < 5000; attempt++) {

        const selected =
            shuffle(allNumbers).slice(0, 16);

        /*
           Split into 4 rows.
        */

        const rows = [

            selected.slice(0, 4),

            selected.slice(4, 8),

            selected.slice(8, 12),

            selected.slice(12, 16)

        ];


        /*
           Row total.
        */

        const rowTotal =
            rows[0].reduce(
                (sum, n) => sum + n,
                0
            );


        /*
           All rows must have same total.
        */

        if (
            rows[1].reduce((s, n) => s + n, 0)
            !== rowTotal
        ) continue;

        if (
            rows[2].reduce((s, n) => s + n, 0)
            !== rowTotal
        ) continue;

        if (
            rows[3].reduce((s, n) => s + n, 0)
            !== rowTotal
        ) continue;


        /*
           Check columns.
        */

        const c1 =
            rows[0][0] +
            rows[1][0] +
            rows[2][0] +
            rows[3][0];

        const c2 =
            rows[0][1] +
            rows[1][1] +
            rows[2][1] +
            rows[3][1];

        const c3 =
            rows[0][2] +
            rows[1][2] +
            rows[2][2] +
            rows[3][2];

        const c4 =
            rows[0][3] +
            rows[1][3] +
            rows[2][3] +
            rows[3][3];


        if (
            c1 !== rowTotal ||
            c2 !== rowTotal ||
            c3 !== rowTotal ||
            c4 !== rowTotal
        ) continue;


        /*
           Valid game.
        */

        return {
            rows,
            magicTotal: rowTotal
        };
    }


    return null;
}


/* =========================
   CREATE GAME KEY
========================= */

function gameKey(game) {

    return game.rows
        .flat()
        .join("-");
}


/* =========================
   SHOW PREVIEW
========================= */

function showPreview(gameId, game) {

    const card =
        document.getElementById("previewCard");

    const grid =
        document.getElementById("grid");

    document.getElementById("previewGameId")
        .innerText = gameId;


    grid.innerHTML = "";


    game.rows.flat().forEach(number => {

        const cell =
            document.createElement("div");

        cell.className = "cell";

        cell.innerText = number;

        grid.appendChild(cell);

    });


    const total =
        game.magicTotal;


    document.getElementById("rowTotals")
        .innerText =
        `ROW TOTALS: ${total} | ${total} | ${total} | ${total}`;


    document.getElementById("columnTotals")
        .innerText =
        `COLUMN TOTALS: ${total} | ${total} | ${total} | ${total}`;


    document.getElementById("magicTotal")
        .innerText =
        `TARGET TOTAL: ${total}`;


    card.classList.remove("hidden");
}


/* =========================
   LOAD EXISTING GAMES
========================= */

async function loadExistingGames() {

    existingGames.clear();

    const snapshot =
        await getDocs(
            collection(db, "games")
        );


    snapshot.forEach(docSnap => {

        const data =
            docSnap.data();


        /*
           Old/new format support.
        */

        if (Array.isArray(data.numbers)) {

            existingGames.add(
                data.numbers.join("-")
            );

            return;
        }


        /*
           Read n1 - n16.
        */

        const numbers = [];

        for (let i = 1; i <= 16; i++) {

            numbers.push(
                data["n" + i]
            );
        }


        if (
            numbers.every(
                n => typeof n === "number"
            )
        ) {

            existingGames.add(
                numbers.join("-")
            );
        }

    });

}


/* =========================
   GENERATE + SAVE
========================= */

window.generateGames = async function () {

    if (!auth.currentUser) {

        alert("Please login first.");

        return;
    }


    if (auth.currentUser.uid !== ADMIN_UID) {

        alert("Admin only.");

        return;
    }


    stopRequested = false;


    const status =
        document.getElementById("status");


    status.innerText =
        "Reading existing games...";


    try {

        await loadExistingGames();

    } catch (error) {

        console.error(error);

        status.innerText =
            "Cannot read Firestore: " +
            error.message;

        return;
    }


    let batch =
        writeBatch(db);

    let batchCount = 0;

    let createdCount = 0;

    let skippedCount = 0;


    const START = 840001;

    const END = 842500;


    for (
        let idNumber = START;
        idNumber <= END;
        idNumber++
    ) {


        /*
           STOP BUTTON
        */

        if (stopRequested) {

            if (batchCount > 0) {

                try {

                    await batch.commit();

                } catch (error) {

                    console.error(error);

                    status.innerText =
                        "Stopped, but save error: " +
                        error.message;

                    return;
                }
            }


            status.innerText =
                `Stopped. Created: ${createdCount}`;

            return;
        }


        const gameId =
            "MKND" +
            idNumber;


        /*
           If this ID already exists,
           don't overwrite it.
        */

        try {

            const existing =
                await getDoc(
                    doc(db, "games", gameId)
                );


            if (existing.exists()) {

                skippedCount++;

                continue;
            }

        } catch (error) {

            console.error(error);

            status.innerText =
                "Firestore read error: " +
                error.message;

            return;
        }


        /*
           Generate unique game.
        */

        let game = null;

        let attempts = 0;


        while (!game && attempts < 10000) {

            game =
                createGame();

            attempts++;
        }


        if (!game) {

            status.innerText =
                "Could not create a valid game.";

            return;
        }


        const key =
            gameKey(game);


        /*
           Prevent duplicate game numbers.
        */

        if (existingGames.has(key)) {

            idNumber--;

            continue;
        }


        existingGames.add(key);


        /*
           Flatten values.
        */

        const numbers =
            game.rows.flat();


        /*
           IMPORTANT:
           No nested arrays are saved.

           n1 ... n16 are individual numbers.
        */

        const gameData = {

            gameId: gameId,

            n1: numbers[0],
            n2: numbers[1],
            n3: numbers[2],
            n4: numbers[3],

            n5: numbers[4],
            n6: numbers[5],
            n7: numbers[6],
            n8: numbers[7],

            n9: numbers[8],
            n10: numbers[9],
            n11: numbers[10],
            n12: numbers[11],

            n13: numbers[12],
            n14: numbers[13],
            n15: numbers[14],
            n16: numbers[15],

            row1Total: game.magicTotal,
            row2Total: game.magicTotal,
            row3Total: game.magicTotal,
            row4Total: game.magicTotal,

            col1Total: game.magicTotal,
            col2Total: game.magicTotal,
            col3Total: game.magicTotal,
            col4Total: game.magicTotal,

            magicTotal: game.magicTotal,

            createdAt: serverTimestamp()

        };


        const gameRef =
            doc(
                db,
                "games",
                gameId
            );


        batch.set(
            gameRef,
            gameData
        );


        batchCount++;

        createdCount++;


        /*
           Show latest generated game.
        */

        showPreview(
            gameId,
            game
        );


        /*
           Firestore batch maximum:
           keep below 500.
        */

        if (batchCount >= 400) {

            status.innerText =
                `Saving... Created: ${createdCount} / 2500`;

            try {

                await batch.commit();

            } catch (error) {

                console.error(error);

                status.innerText =
                    "Save error: " +
                    error.message;

                return;
            }


            batch =
                writeBatch(db);

            batchCount = 0;
        }


        /*
           Update progress.
        */

        status.innerText =
            `Generated: ${createdCount} | Existing skipped: ${skippedCount} | Current: ${gameId}`;
    }


    /*
       Save remaining games.
    */

    if (batchCount > 0) {

        try {

            await batch.commit();

        } catch (error) {

            console.error(error);

            status.innerText =
                "Final save error: " +
                error.message;

            return;
        }
    }


    status.innerText =
        `COMPLETED. Created: ${createdCount} | Existing skipped: ${skippedCount}`;

};


/* =========================
   STOP
========================= */

window.stopGeneration = function () {

    stopRequested = true;

    document.getElementById("status")
        .innerText =
        "Stopping after current save...";

};

</script>

</body>
</html>
